<!DOCTYPE html>
<html>
<head>
    <title>Booking Page</title>

    <style>
                
                *{
                    margin: 0;
                    padding: 0;
                    box-sizing: border-box; 
                }
                .logo{
                    font-weight: bold;
                    font-size: 20px;
                }

                .nav_bar{
                    display: flex;
                    justify-content:space-between;
                    align-items: center;
                    background-color: transparent;
                    padding: 15px 40px;
                    font-family: Arial;
                    font-weight: bold;
                }
                .nav_links{
                    list-style: none;
                    display: flex;
                }
                .nav_links li{
                    margin-left: 25px;
                }
                .nav_links a{
                    text-decoration: none;
                    color: black;
                    font-size: 16px;
                    position: relative;
                }
                .nav_links a::after{
                    content: "";
                    position: absolute;
                    width: 0%;
                    height: 2px;
                    background: black;
                    left: 0;
                    bottom: -5px;
                    transition: 0.3s;
                }
                .nav_links a:hover::after{
                    width:100%;
                }
                .nav_links a.active{
                    color:white;
                }
                .nav_links a.active img{
                    filter: brightness(0) invert(1) 
                }


        body {
            font-family: Arial;
            text-align: center;
            background-image: url("C:/Users/CHAMA COMPUTERS/OneDrive/Desktop/PET Web/pictures/Animal_99D_B099_1004264240.jpg"); 
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            margin: 0;
            padding: 0;
        }

        h1 {
            font-size: 35px;
            color:black;
            font-family:arial;
            
        }

        .form-box {
            width: 380px;
            margin:  auto;
            border-radius: 15px;
            padding: 25px;
            background-color:transparent ;
            text-align: left;
        }

        label {
            font-size: 16px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 12px;
            font-size: 14px;
            border-radius: 5px;
            border: none;
        }

        .radio-group {
            margin-bottom: 10px;
        }

        .radio-group input {
            width: auto;
        }

        .btn-group {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        button {
            width: 48%;
            padding: 10px;
            border: none;
            border-radius: 7px;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        .submit_btn {
            background-color: green;
        }
        .submit_btn:hover{
            background-color: rgb(4, 184, 4);
        }

        .reset_btn {
            background-color: rgb(214, 5, 5);
        }
        .reset_btn:hover{
            background-color: rgb(239, 11, 46);
        }

        .back_btn {
            display: block;
            text-align: center;
            margin-top: 15px;
        }

        .back_btn a {
            display: inline-block;
            padding: 10px 20px;
            background-color: rgb(14, 31, 126);
            color: white;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
        }

        .back_btn a:hover {
            background-color: rgb(10, 45, 204);
        }
    </style>
</head>

<body>

                </ul>
            </nav>

    <h1>Make a book here</h1>

    <div class="form-box">

        <form id="petForm">

            <label>Pet's Name:</label>
            <input type="text" name="pet_name" required>

            <label>Breed:</label>
            <input type="text" name="breed" required>

            <label>Age:</label>
            <input type="number" name="age" required>

            <label>Gender:</label>
            <div class="radio-group">
                <label><input type="radio" name="gender" value="male"> Male</label>
                <label><input type="radio" name="gender" value="female"> Female</label>
            </div>

            <label>Owner's Name:</label>
            <input type="text" name="owner_name" required>

            <label>Email:</label>
            <input type="email" name="email" required>

            <label>Contact Number:</label>
            <input type="text" name="phone" required>

            <label>Location:</label>
            <div class="radio-group">
                <label><input type="radio" name="location" value="kandy"> Kandy</label>
                <label><input type="radio" name="location" value="matale"> Matale</label>
                <label><input type="radio" name="location" value="nuwara_eliya"> Nuwara Eliya</label>
            </div>

            <div class="btn-group">
                <button type="submit" class="submit_btn">Register</button>
                <button type="reset" class="reset_btn">Clear</button>
            </div>

        </form>

        <div class="back_btn">
            <a href="home.html">Back</a>
        </div>

    </div>

    <script>
        document.getElementById("petForm").addEventListener("submit", function(event) {
            event.preventDefault();

            let phone = document.getElementsByName("phone")[0].value;

            if (phone.length < 10) {
                alert("Please enter a valid phone number!");
                return;
            }

            alert("Registration Successful!");
        });
         window.addEventListener("scroll",function(){
                const navbar = document.querySelector(".nav_bar");

                if(window.scrollY>50){
                    navbar.style.backgroundColor = "rgba(0,0,0,0.8)";
                    navbar.style.color = "white";

                }else{
                    navbar.style.backgroundColor = "transparent";
                    
                }
            });
            const links = document.querySelectorAll(".nav_links a");

            links.forEach(link =>{
                if(link.href === window.location.href){
                    link.classList.add("active");
                }
            });

    </script>

</body>
