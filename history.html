<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Appointment History - PetSphere</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #F8FAFC;
            color: #1E293B;
        }

        /* ================= NAVIGATION ================= */

        .nav_bar {
            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 15px 40px;

            background: white;

            position: fixed;
            top: 0;
            left: 0;

            width: 100%;

            z-index: 1000;

            box-shadow: 0 3px 15px rgba(0,0,0,.08);
        }

        .logo img {
            width: 70px;
        }

        .nav_links {
            list-style: none;

            display: flex;

            align-items: center;

            gap: 25px;
        }

        .nav_links a {
            text-decoration: none;

            color: #1E293B;

            font-weight: 500;

            transition: .3s;
        }

        .nav_links a:hover {
            color: #2563EB;
        }

        /* ================= PAGE ================= */

        .history-section {

            width: 90%;

            max-width: 1200px;

            margin: 140px auto 80px;
        }

        .page-heading {

            text-align: center;

            margin-bottom: 50px;
        }

        .page-heading span {

            display: inline-block;

            padding: 10px 24px;

            background: #DBEAFE;

            color: #2563EB;

            border-radius: 40px;

            font-weight: 600;

            margin-bottom: 15px;
        }

        .page-heading h1 {

            font-size: 45px;

            margin-bottom: 15px;
        }

        .page-heading p {

            color: #64748B;

            font-size: 17px;
        }

        /* ================= APPOINTMENT LIST ================= */

        #appointmentList {

            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(320px, 1fr));

            gap: 25px;
        }

        .appointment-card {

            background: white;

            border-radius: 20px;

            padding: 30px;

            box-shadow: 0 15px 40px rgba(0,0,0,.08);

            border: 2px solid #E2E8F0;

            transition: .3s;
        }

        .appointment-card:hover {

            transform: translateY(-5px);

            border-color: #2563EB;
        }

        .appointment-card h2 {

            color: #2563EB;

            margin-bottom: 20px;
        }

        .appointment-info {

            margin-bottom: 10px;

            color: #475569;

            line-height: 26px;
        }

        .appointment-info strong {

            color: #1E293B;
        }

        /* ================= STATUS ================= */

        .status {

            display: inline-block;

            padding: 7px 15px;

            border-radius: 30px;

            font-size: 14px;

            font-weight: 600;

            margin-top: 10px;
        }

        .status.pending {

            background: #FEF3C7;

            color: #92400E;
        }

        .status.approved {

            background: #DCFCE7;

            color: #166534;
        }

        .status.completed {

            background: #DBEAFE;

            color: #1E40AF;
        }

        .status.cancelled {

            background: #FEE2E2;

            color: #991B1B;
        }

        /* ================= CANCEL BUTTON ================= */

        .cancel-btn {

            width: 100%;

            margin-top: 20px;

            padding: 13px;

            border: none;

            border-radius: 12px;

            background: #DC2626;

            color: white;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;

            transition: .3s;
        }

        .cancel-btn:hover {

            background: #B91C1C;

            transform: translateY(-2px);
        }

        .cancel-btn:disabled {

            background: #CBD5E1;

            cursor: not-allowed;

            transform: none;
        }

        /* ================= MESSAGE ================= */

        .message {

            text-align: center;

            padding: 30px;

            color: #64748B;

            font-size: 17px;
        }

        /* ================= MOBILE ================= */

        @media(max-width: 700px) {

            .nav_bar {

                padding: 15px 20px;
            }

            .nav_links {

                gap: 10px;
            }

            .nav_links li:not(:last-child) {

                display: none;
            }

            .history-section {

                margin-top: 120px;
            }

            .page-heading h1 {

                font-size: 34px;
            }

        }

    </style>

</head>


<body>


<!-- ================= NAVIGATION ================= -->

<nav class="nav_bar">

    <div class="logo">

        <img src="pictures/logo.png" alt="PetSphere">

    </div>


    <ul class="nav_links">

        <li>
            <a href="home.html">Home</a>
        </li>

        <li>
            <a href="Registration.html">Registration</a>
        </li>

        <li>
            <a href="services.html">Services</a>
        </li>

        <li>
            <a href="history.html">My Appointments</a>
        </li>

    </ul>

</nav>



<!-- ================= HISTORY SECTION ================= -->

<section class="history-section">


    <div class="page-heading">

        <span>My Appointments</span>

        <h1>Appointment History</h1>

        <p>
            View and manage your PetSphere appointments.
        </p>

    </div>


    <!--
        JavaScript will insert appointment cards here.
    -->

    <div id="appointmentList">

        <div class="message">
            Loading appointments...
        </div>

    </div>


</section>



<script>

/* ================================================= */
/* ============== LOAD APPOINTMENTS ================= */
/* ================================================= */


function loadAppointments() {


    /*
    |--------------------------------------------------------------------------
    | Send request to history.php
    |--------------------------------------------------------------------------
    */

    fetch("backend/appoinment/history.php")


        /*
        |--------------------------------------------------------------------------
        | Convert response into JSON
        |--------------------------------------------------------------------------
        */

        .then(response => response.json())


        /*
        |--------------------------------------------------------------------------
        | Work with returned data
        |--------------------------------------------------------------------------
        */

        .then(data => {


            const appointmentList =
                document.getElementById("appointmentList");


            /*
            |--------------------------------------------------------------------------
            | Check for backend error
            |--------------------------------------------------------------------------
            */

            if (data.status !== "success") {

                appointmentList.innerHTML = `
                    <div class="message">
                        ${data.message}
                    </div>
                `;

                return;
            }


            /*
            |--------------------------------------------------------------------------
            | Check whether appointments exist
            |--------------------------------------------------------------------------
            */

            if (
                !data.appointments ||
                data.appointments.length === 0
            ) {

                appointmentList.innerHTML = `
                    <div class="message">
                        You don't have any appointments yet.
                    </div>
                `;

                return;
            }


            /*
            |--------------------------------------------------------------------------
            | Clear loading message
            |--------------------------------------------------------------------------
            */

            appointmentList.innerHTML = "";


            /*
            |--------------------------------------------------------------------------
            | Create a card for every appointment
            |--------------------------------------------------------------------------
            */

            data.appointments.forEach(appointment => {


                /*
                |--------------------------------------------------------------------------
                | Create appointment card
                |--------------------------------------------------------------------------
                */

                const card =
                    document.createElement("div");

                card.className =
                    "appointment-card";


                /*
                |--------------------------------------------------------------------------
                | Convert status to CSS class
                |--------------------------------------------------------------------------
                */

                const statusClass =
                    appointment.status
                    .toLowerCase();


                /*
                |--------------------------------------------------------------------------
                | Decide whether cancellation is allowed
                |--------------------------------------------------------------------------
                */

                let cancelButton = "";


                if (
                    appointment.status !== "Cancelled" &&
                    appointment.status !== "Completed"
                ) {

                    cancelButton = `
                        <button
                            class="cancel-btn"
                            onclick="cancelAppointment(${appointment.id})">

                            Cancel Appointment

                        </button>
                    `;

                }


                /*
                |--------------------------------------------------------------------------
                | Create card HTML
                |--------------------------------------------------------------------------
                */

                card.innerHTML = `

                    <h2>
                        ${appointment.pet_name}
                    </h2>

                    <div class="appointment-info">
                        <strong>Service:</strong>
                        ${appointment.service_name}
                    </div>

                    <div class="appointment-info">
                        <strong>Staff:</strong>
                        ${appointment.staff_name || "No Preference"}
                    </div>

                    <div class="appointment-info">
                        <strong>Date:</strong>
                        ${appointment.appointment_date}
                    </div>

                    <div class="appointment-info">
                        <strong>Time:</strong>
                        ${appointment.appointment_time}
                    </div>

                    <div class="appointment-info">
                        <strong>Notes:</strong>
                        ${appointment.notes || "No notes"}
                    </div>

                    <span class="status ${statusClass}">
                        ${appointment.status}
                    </span>

                    ${cancelButton}

                `;


                /*
                |--------------------------------------------------------------------------
                | Add card to page
                |--------------------------------------------------------------------------
                */

                appointmentList.appendChild(card);

            });

        })


        /*
        |--------------------------------------------------------------------------
        | Handle connection errors
        |--------------------------------------------------------------------------
        */

        .catch(error => {

            console.error(
                "Appointment History Error:",
                error
            );


            document.getElementById(
                "appointmentList"
            ).innerHTML = `

                <div class="message">

                    Something went wrong
                    while loading your appointments.

                </div>

            `;

        });

}


/* ================================================= */
/* ============== CANCEL APPOINTMENT ================ */
/* ================================================= */


function cancelAppointment(appointmentId) {


    /*
    |--------------------------------------------------------------------------
    | Ask for confirmation
    |--------------------------------------------------------------------------
    */

    const confirmed =
        confirm(
            "Are you sure you want to cancel this appointment?"
        );


    /*
    |--------------------------------------------------------------------------
    | Stop if user selects Cancel
    |--------------------------------------------------------------------------
    */

    if (!confirmed) {

        return;
    }


    /*
    |--------------------------------------------------------------------------
    | Create form data
    |--------------------------------------------------------------------------
    */

    const formData =
        new FormData();


    formData.append(
        "appointment_id",
        appointmentId
    );


    /*
    |--------------------------------------------------------------------------
    | Send cancellation request
    |--------------------------------------------------------------------------
    */

    fetch(
        "backend/appoinment/cancel.php",
        {
            method: "POST",
            body: formData
        }
    )


        /*
        |--------------------------------------------------------------------------
        | Convert response to JSON
        |--------------------------------------------------------------------------
        */

        .then(response => response.json())


        /*
        |--------------------------------------------------------------------------
        | Display result
        |--------------------------------------------------------------------------
        */

        .then(data => {


            alert(data.message);


            /*
            |--------------------------------------------------------------------------
            | Reload appointments after successful cancellation
            |--------------------------------------------------------------------------
            */

            if (data.status === "success") {

                loadAppointments();

            }

        })


        /*
        |--------------------------------------------------------------------------
        | Handle errors
        |--------------------------------------------------------------------------
        */

        .catch(error => {

            console.error(
                "Cancellation Error:",
                error
            );

            alert(
                "Something went wrong while cancelling the appointment."
            );

        });

}


/* ================================================= */
/* ============== START PAGE ======================== */
/* ================================================= */


loadAppointments();

</script>


</body>

</html>
